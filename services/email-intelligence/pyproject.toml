[project]
name = "becbarrier-email-intelligence"
version = "1.0.0"
description = "BECBarrier internal email-intelligence service: safe .eml parsing, provenance-aware normalization and deterministic BEC-01..07 rule evaluation. Non-authoritative analysis only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "idna>=3.7,<4.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # FastAPI DI in defaults; str-Enum kept for Pydantic 2 serialization clarity

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
